name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 👇 すべてのジョブを worker フォルダ内で実行するように指定
defaults:
  run:
    working-directory: ./worker

jobs:
  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # 💡 重複していた npm install は削除し、高速な npm ci のみに統一しました
      - run: npm ci
      - name: Install ESLint and Prettier (if not present)
        run: npm install --save-dev eslint prettier eslint-plugin-import
      - name: Run ESLint
        run: npx eslint . --ext .js,.ts || true
      - name: Run Prettier check
        run: npx prettier --check "." || true

  # Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - name: Run tests
        run: npm test

  # Wrangler build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - name: Install wrangler (if not globally)
        run: npm install --save-dev wrangler
      - name: Build worker
        run: npx wrangler build src/index.ts

  # License check
  license-check:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - name: Install license-checker-rseidelsohn
        run: npm install --save-dev license-checker-rseidelsohn
      - name: Generate Third Party Notices
        run: npx license-checker-rseidelsohn --unknown --out THIRD-PARTY-NOTICES.txt
      - name: Block Copyleft Licenses
        run: npx license-checker-rseidelsohn --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;CC0-1.0"
      - name: Upload License Notice
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: worker/THIRD-PARTY-NOTICES.txt # 💡 アップロード対象のパスを調整

  # Vulnerability check
  vulnerability-check:
    runs-on: ubuntu-latest
    needs: [license-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - name: Run npm audit (production only)
        run: npm audit --production --audit-level=high
      - name: Upload Audit Report (if fails)
        if: failure()
        run: |
          npm audit --production --json > audit-report.json || true
        continue-on-error: true
      - name: Upload Audit Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: worker/audit-report.json # 💡 アップロード対象のパスを調整
