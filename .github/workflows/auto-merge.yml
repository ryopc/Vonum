name: Auto Merge

on:
  # ステータスチェック（CI）が完了したときに起動
  status:
  # GitHub Actionsの各ジョブが完了したときに起動
  workflow_run:
    workflows: ["CI"] # 今使っているci.ymlの「name: CI」と一致させてください
    types:
      - completed

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # PRを作成した本人（またはシステム）がトリガーの場合のみ実行
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Automatically merge PR
        # GitHub標準のCLIツール（gh）を使ってコマンドでマージを実行します
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
